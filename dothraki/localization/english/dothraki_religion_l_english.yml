l_english:
 # Religion + default faith
 dothraki_religion:0 "Faith of the Great Stallion"
 dothraki_religion_desc:0 "The Dothraki worship the Great Stallion, a horse-god whose herd is the world and whose stars are the souls of khals long dead. The widowed dosh khaleen at Vaes Dothrak read omens in the night sky and speak the will of the Stallion. Those who die with arakh in hand ride the night herd forever; those who do not are doomed to wander the cold dark."
 faith_of_the_great_stallion:0 "Faith of the Great Stallion"
 faith_of_the_great_stallion_desc:0 "The unreformed faith of all khalasars."

